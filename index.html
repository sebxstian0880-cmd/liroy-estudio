<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liroy Estudio de Idiomas | Inscripciones</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #111827;
      --accent: #facc15;
      --accent-hover: #eab308;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* --- PANTALLA 1: ANIMACIÓN DE BIENVENIDA (100% PANTALLA) --- */
    #welcome-screen {
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 75%);
      position: relative;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #welcome-screen.hidden-screen {
      opacity: 0;
      transform: translateY(-30px);
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
    }

    .badge {
      background: rgba(250, 204, 21, 0.15);
      color: var(--accent);
      border: 1px solid rgba(250, 204, 21, 0.4);
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.2s;
    }

    .hero-title {
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 800;
      line-height: 1.1;
      max-width: 800px;
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.5s;
    }

    .hero-title span {
      color: var(--accent);
    }

    .hero-sub {
      color: var(--text-muted);
      font-size: clamp(1rem, 2vw, 1.25rem);
      max-width: 600px;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.8s;
    }

    .start-btn {
      background-color: var(--accent);
      color: #090d16;
      border: none;
      padding: 1rem 2.2rem;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(250, 204, 21, 0.25);
      transition: transform 0.2s ease, background-color 0.2s ease;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.1s;
    }

    .start-btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-3px);
    }

    /* --- PANTALLA 2: FORMULARIO DE INSCRIPCIÓN --- */
    #form-section {
      min-height: 100vh;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      opacity: 0;
      transform: translateY(25px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #form-section.visible-screen {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }

    .form-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .form-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .form-header h2 {
      font-size: 1.7rem;
      margin-bottom: 0.4rem;
    }

    .form-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .input-group {
      margin-bottom: 1.2rem;
    }

    .input-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #cbd5e1;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 0.85rem 1rem;
      background-color: #090d16;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: var(--accent);
    }

    .submit-btn {
      width: 100%;
      padding: 1rem;
      background-color: #22c55e;
      color: #052e16;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 0.8rem;
      transition: background-color 0.2s, transform 0.2s;
    }

    .submit-btn:hover {
      background-color: #16a34a;
      transform: translateY(-2px);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.2rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- 1. PANTALLA DE BIENVENIDA PRIMERO -->
  <section id="welcome-screen">
    <div class="badge">🎁 Clase de Prueba de 30 Minutos GRATIS</div>
    <h1 class="hero-title">Domina un nuevo idioma con <span>Liroy Estudio</span></h1>
    <p class="hero-sub">Clases en vivo personalizadas, plataformas interactivas y aprendizaje real desde cualquier lugar del mundo.</p>
    <button class="start-btn" onclick="mostrarFormulario()">Reservar mi Clase Gratis →</button>
  </section>

  <!-- 2. FORMULARIO DE INSCRIPCIÓN (APARECE DESPUÉS) -->
  <section id="form-section">
    <div class="form-card">
      <div class="form-header">
        <h2>Completa tu Registro</h2>
        <p>Déjanos tus datos y coordinamos tu clase gratuita por WhatsApp.</p>
      </div>

      <form id="registroForm" onsubmit="enviarWhatsApp(event)">
        <div class="input-group">
          <label for="nombre">Nombre y Apellido</label>
          <input type="text" id="nombre" placeholder="Ej. Carlos Mendoza" required />
        </div>

        <div class="input-group">
          <label for="edad">Edad del Estudiante</label>
          <input type="number" id="edad" placeholder="Ej. 16" min="5" max="99" required />
        </div>

        <div class="input-group">
          <label for="idioma">Idioma de Interés</label>
          <select id="idioma" required>
            <option value="" disabled selected>Selecciona un idioma...</option>
            
            <!-- Idiomas Disponibles -->
            <option value="Inglés">Inglés</option>
            <option value="Francés">Francés</option>
            <option value="Portugués">Portugués</option>

            <!-- Idiomas Bloqueados -->
            <option value="Italiano" disabled>Italiano 🔒 (No disponible)</option>
            <option value="Alemán" disabled>Alemán 🔒 (No disponible)</option>
            <option value="Chino Mandarín" disabled>Chino Mandarín 🔒 (Próximamente)</option>
            <option value="Japonés" disabled>Japonés 🔒 (Próximamente)</option>
            <option value="Ruso" disabled>Ruso 🔒 (No disponible)</option>
          </select>
        </div>

        <div class="input-group">
          <label for="nivel">Nivel Actual</label>
          <select id="nivel" required>
            <option value="Principiante (Desde cero)">Principiante (Desde cero - A1)</option>
            <option value="Intermedio (B1)">Intermedio (B1)</option>
            <option value="Avanzado (C1)">Avanzado (C1)</option>
          </select>
        </div>

        <div class="input-group">
          <label for="experiencia">Tiempo de Experiencia con el Idioma</label>
          <select id="experiencia" required>
            <option value="" disabled selected>Selecciona tu experiencia previa...</option>
            <option value="Cero (Nunca lo he estudiado)">Cero / Nunca lo he estudiado (Desde el inicio)</option>
            <option value="Menos de 6 meses">Menos de 6 meses</option>
            <option value="Entre 6 meses y 1 año">Entre 6 meses y 1 año</option>
            <option value="Más de 1 año (Tengo bases)">Más de 1 año (Tengo bases)</option>
          </select>
        </div>

        <button type="submit" class="submit-btn">Enviar Solicitud a WhatsApp 📲</button>
      </form>

      <span class="back-link" onclick="volverBienvenida()">← Volver al inicio</span>
    </div>
  </section>

  <script>
    // Cambia de la animación inicial al formulario
    function mostrarFormulario() {
      const welcome = document.getElementById('welcome-screen');
      const formSection = document.getElementById('form-section');

      welcome.classList.add('hidden-screen');
      
      setTimeout(() => {
        welcome.style.display = 'none';
        formSection.style.display = 'flex';
        setTimeout(() => {
          formSection.classList.add('visible-screen');
        }, 50);
      }, 600);
    }

    // Regresar a la pantalla de bienvenida
    function volverBienvenida() {
      const welcome = document.getElementById('welcome-screen');
      const formSection = document.getElementById('form-section');

      formSection.classList.remove('visible-screen');
      setTimeout(() => {
        formSection.style.display = 'none';
        welcome.style.display = 'flex';
        setTimeout(() => {
          welcome.classList.remove('hidden-screen');
        }, 50);
      }, 500);
    }

    // Envía los datos directos al WhatsApp de la academia
    function enviarWhatsApp(e) {
      e.preventDefault();

      // ⚠️ CAMBIA ESTE NÚMERO POR TU WHATSAPP REAL (código de país + número, sin el +)
      const telefonoAcademia = "584125952360"; 

      const nombre = document.getElementById('nombre').value;
      const edad = document.getElementById('edad').value;
      const idioma = document.getElementById('idioma').value;
      const nivel = document.getElementById('nivel').value;
      const experiencia = document.getElementById('experiencia').value;

      const mensaje = `¡Hola! Vengo de la web de *Liroy Estudio de Idiomas* y quiero reservar mi clase de prueba GRATIS.%0A%0A` +
                      `👤 *Nombre:* ${nombre}%0A` +
                      `🎂 *Edad:* ${edad} años%0A` +
                      `🌍 *Idioma:* ${idioma}%0A` +
                      `📊 *Nivel:* ${nivel}%0A` +
                      `⏳ *Experiencia:* ${experiencia}`;

      const url = `https://wa.me/${telefonoAcademia}?text=${mensaje}`;
      window.open(url, '_blank');
    }
  </script>

</body>
</html>
